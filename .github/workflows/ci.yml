name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./gateway
      - run: python -m unittest discover -s tests -v
        working-directory: gateway

  egress:
    name: Egress proxy checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./gateway[egress]"
      - run: python -m unittest discover -s gateway/egress -p 'test_*.py' -v
      - run: bash gateway/egress/test_local.sh

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.sh' | xargs shellcheck -S warning
      - run: bash host/test-readiness.sh
      - run: python3 host/test-network.py

  source-release:
    name: Source release preparation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test-release.py -v
      - run: python tests/acceptance/test-source.py -v
      - run: python tools/prepare-release.py --output /tmp/pac-release-a
      - run: python tools/prepare-release.py --output /tmp/pac-release-b
      - run: diff -r /tmp/pac-release-a /tmp/pac-release-b
      - run: sha256sum -c *.sha256
        working-directory: /tmp/pac-release-a
      - name: Offline install smoke from extracted source
        run: |
          mkdir /tmp/pac-extracted-source
          tar -xzf /tmp/pac-release-a/*.tar.gz --strip-components=1 -C /tmp/pac-extracted-source
          test ! -e /tmp/pac-extracted-source/.git
          cd /tmp
          python /tmp/pac-extracted-source/tests/acceptance/check-source.py
