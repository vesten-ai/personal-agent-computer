<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Agent Computer</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
    --accent: #2f5bd3; --user: #eef2fd; --warn: #a15c00; --err: #b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #33332f;
            --accent: #8aa8ff; --user: #23283a; --warn: #e3a64a; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1.1fr); height: 100dvh; }
  aside, main, section { min-height: 0; }
  aside { border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  aside h1 { font-size: 15px; margin: 0; }
  .agents { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .agents li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .agents li.on { background: var(--user); }
  .agents .st { color: var(--muted); font-size: 12px; }
  form.new { display: flex; gap: 6px; }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  main { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.think { color: var(--muted); font-size: 13px; border-style: dashed; }
  .msg.act { font: 12px/1.4 var(--mono); color: var(--muted); background: transparent; }
  .msg.notice { color: var(--warn); font-size: 13px; background: transparent; border: 0; padding: 0 4px; }
  .msg.error { color: var(--err); }
  .msg.approval { border-color: var(--warn); display: grid; gap: 8px; max-width: 100%; }
  .approval .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .approval .answered { color: var(--muted); font-size: 13px; }
  .compose { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .compose textarea { resize: none; height: 44px; }
  section { display: flex; flex-direction: column; padding: 16px; gap: 8px; }
  .screen { width: 100%; aspect-ratio: 16 / 10; background: #000; border-radius: 8px; object-fit: contain; }
  .screen[hidden] { display: none; }
  .placeholder { display: grid; place-items: center; color: #8a8a85; font-size: 13px; }
  .live { overflow: hidden; }
  .live.control { outline: 2px solid var(--accent); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .tools button { padding: 4px 10px; font-size: 13px; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }
  .bar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .agents { display: flex; gap: 6px; overflow-x: auto; }
    section { order: -1; padding: 8px 16px; }
    main { border-right: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Personal Agent Computer</h1>
    <ul class="agents" id="agents"></ul>
    <form class="new" id="new">
      <input id="newname" placeholder="New agent name" maxlength="40" required>
      <button>Add</button>
    </form>
  </aside>
  <main>
    <div class="log" id="log"><p class="empty">Add an agent to give it a computer.</p></div>
    <form class="compose" id="compose">
      <textarea id="text" placeholder="Tell your agent what to do" disabled></textarea>
      <button id="send" disabled>Send</button>
      <button id="stop" class="ghost" type="button" hidden>Stop</button>
    </form>
  </main>
  <section>
    <div class="bar">
      <span id="title">No agent selected</span>
      <span class="tools"><span id="status"></span>
        <button id="wake" class="ghost" type="button" hidden>Wake</button>
        <button id="takeover" class="ghost" type="button" hidden>Take over</button>
        <button id="handback" type="button" hidden>Hand back</button></span>
    </div>
    <div class="screen live" id="live" hidden></div>
    <img class="screen" id="screen" alt="The agent's screen" hidden>
    <div class="screen placeholder" id="noscreen">No screenshot yet</div>
    <p class="hint" id="hint"></p>
    <button id="delete-agent" class="ghost" type="button" hidden>Delete agent</button>
    <p class="hint" id="delete-feedback" role="status"></p>
  </section>
</div>
<script type="module">
import RFB from "/static/novnc/core/rfb.js";
const $ = (id) => document.getElementById(id);
const wsBase = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
let agents = [], current = null, ws = null, lastId = 0, rfb = null, takenOver = false, replaying = false, deleting = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw Object.assign(new Error(data.error || r.statusText), {
      code: data.code, retryable: data.retryable === true && data.agent_retained === true,
      agentRetained: data.agent_retained
    });
  }
  return r.json();
}

async function loadAgents() {
  const data = await api("/api/agents");
  agents = data.agents;
  const ul = $("agents");
  ul.replaceChildren(...agents.map((a) => {
    const li = document.createElement("li");
    li.className = a.id === current ? "on" : "";
    li.innerHTML = `<span></span><span class="st"></span>`;
    li.firstChild.textContent = a.name;
    li.lastChild.textContent = a.taken_over ? "taken over" : a.status === "waiting" ? "waiting for you" : a.busy ? "working" : a.status;
    li.onclick = () => select(a.id);
    return li;
  }));
  if (!current && agents.length) select(agents[0].id);
}

function add(ev) {
  if (ev.id <= lastId) return;
  lastId = ev.id;
  const log = $("log");
  const d = ev.data || {};
  let cls = null, text = null;
  switch (ev.kind) {
    case "user": cls = "user"; text = d.text; break;
    case "text": cls = ""; text = d; break;
    case "thinking": cls = "think"; text = d; break;
    case "actions": cls = "act"; text = (d || []).join("\n"); break;
    case "notice": cls = "notice"; text = d.text; break;
    case "error": cls = "error"; text = d.text; break;
    case "screenshot": $("screen").src = `/api/agents/${current}/screen.png?t=${ev.id}`; return;
    case "approval": addApproval(d); return;
    case "approval_answered": settleApproval(d.id, d.answer); return;
    case "status":
      if (replaying) return;
      setStatus(d.status);
      if (d.status === "ready" && !rfb) connectScreen(current);
      return;
  }
  if (text == null || text === "") return;
  log.querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (ev.kind === "text" || ev.kind === "thinking") div.innerHTML = inline(text); else div.textContent = text;
  log.append(div);
  log.scrollTop = log.scrollHeight;
}

// The agent asks before risky steps: a card with the options, answered by a click (or typed text).
function addApproval(d) {
  const log = $("log");
  log.querySelector(".empty")?.remove();
  const card = document.createElement("div");
  card.className = "msg approval";
  card.dataset.qid = d.id;
  const q = document.createElement("div");
  q.textContent = d.question;
  const row = document.createElement("div");
  row.className = "choices";
  for (const opt of d.options) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = opt;
    b.onclick = () => ws?.send(JSON.stringify({ type: "answer", id: d.id, text: opt }));
    row.append(b);
  }
  const other = document.createElement("input");
  other.placeholder = "Or type an answer";
  other.onkeydown = (e) => {
    if (e.key === "Enter" && !e.isComposing && other.value.trim()) {
      ws?.send(JSON.stringify({ type: "answer", id: d.id, text: other.value.trim() }));
    }
  };
  card.append(q, row, other);
  log.append(card);
  log.scrollTop = log.scrollHeight;
}

function settleApproval(id, answer) {
  const card = document.querySelector(`.approval[data-qid="${id}"]`);
  if (!card) return;
  card.querySelectorAll("button, input").forEach((el) => el.remove());
  const a = document.createElement("div");
  a.className = "answered";
  a.textContent = `You answered: ${answer}`;
  card.append(a);
}

// Just enough Markdown for chat replies: **bold** and `code`, on HTML-escaped text.
function inline(t) {
  const esc = t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}

function setStatus(s) {
  $("status").textContent = { taken_over: "you have control", waiting: "waiting for your answer" }[s] || s;
  $("stop").hidden = s !== "working" && s !== "waiting";
  $("wake").hidden = s !== "asleep";
  const ready = ["ready", "working", "waiting", "taken_over", "asleep"].includes(s);
  $("text").disabled = $("send").disabled = !ready;
  $("delete-agent").hidden = !current;
  $("delete-agent").disabled = deleting || ["creating", "working", "waiting"].includes(s);
  takenOver = s === "taken_over";
  $("takeover").hidden = !ready || takenOver || s === "asleep";
  $("handback").hidden = !takenOver;
  if (rfb) rfb.viewOnly = !takenOver;
  $("live").classList.toggle("control", takenOver);
  $("hint").textContent = takenOver ? "You are driving. Hand back when you are done; the agent will look before it continues." : "";
  loadAgents();
}

// Live screen through the gateway's VNC relay; the last screenshot stands in while it is not connected.
function connectScreen(id) {
  rfb?.disconnect();
  rfb = null;
  const el = $("live");
  el.replaceChildren();
  const r = new RFB(el, `${wsBase}/api/agents/${id}/vnc`, { wsProtocols: ["binary"] });
  r.viewOnly = !takenOver;
  r.scaleViewport = true;
  r.background = "#000";
  r.addEventListener("connect", () => {
    if (rfb !== r) return;
    el.hidden = false; $("screen").hidden = $("noscreen").hidden = true;
  });
  r.addEventListener("disconnect", () => {
    if (rfb !== r) return;
    rfb = null;
    el.hidden = true;
    $("screen").dispatchEvent(new Event($("screen").naturalWidth ? "load" : "error"));
    setTimeout(() => current === id && !rfb && connectScreen(id), 5000);
  });
  rfb = r;
}

async function select(id) {
  current = id; lastId = 0;
  $("delete-agent").textContent = "Delete agent";
  $("delete-feedback").textContent = "";
  ws?.close();
  const a = agents.find((x) => x.id === id);
  $("title").textContent = a ? `${a.name} · ${a.model}` : "";
  $("log").replaceChildren();
  $("screen").src = `/api/agents/${id}/screen.png?t=${Date.now()}`;
  const { events } = await api(`/api/agents/${id}/events`);
  if (current !== id) return;  // another agent was picked while this one loaded
  replaying = true;
  events.forEach(add);
  replaying = false;
  setStatus(a.taken_over ? "taken_over" : a.status === "waiting" ? "waiting" : a.busy ? "working" : a.status);
  if (a.status !== "creating" && a.status !== "error") connectScreen(id);
  ws = new WebSocket(`${wsBase}/api/agents/${id}/ws`);
  ws.onmessage = (m) => add(JSON.parse(m.data));
  ws.onclose = () => { if (current === id) setTimeout(() => current === id && select(id), 2000); };
}

function clearSelection() {
  current = null;
  ws?.close(); ws = null;
  rfb?.disconnect(); rfb = null;
  $("title").textContent = "No agent selected";
  $("log").replaceChildren();
  $("live").hidden = $("screen").hidden = true;
  $("noscreen").hidden = false;
  $("text").disabled = $("send").disabled = true;
  ["stop", "wake", "takeover", "handback", "delete-agent"].forEach((id) => $(id).hidden = true);
  $("status").textContent = "";
  $("hint").textContent = "";
}

$("delete-agent").onclick = async () => {
  const id = current, agent = agents.find((a) => a.id === id);
  if (!agent || deleting || !confirm(`Delete ${agent.name} and its computer?`)) return;
  deleting = true;
  $("delete-agent").disabled = true;
  try {
    await api(`/api/agents/${id}`, { method: "DELETE" });
    if (current === id) clearSelection();
    await loadAgents();
    $("delete-feedback").textContent = `Deleted ${agent.name}.`;
  } catch (error) {
    if (current !== id) return;
    if (error.agentRetained === false) {
      clearSelection();
      await loadAgents().catch(() => {});
    }
    $("delete-feedback").textContent = error.message;
    $("delete-agent").textContent = error.retryable ? "Retry delete" : "Delete agent";
  } finally {
    deleting = false;
    const selected = agents.find((a) => a.id === current);
    $("delete-agent").disabled = !selected || selected.busy || ["creating", "working", "waiting"].includes(selected.status);
  }
};

$("new").onsubmit = async (e) => {
  e.preventDefault();
  const a = await api("/api/agents", { method: "POST", body: JSON.stringify({ name: $("newname").value }) });
  $("newname").value = "";
  await loadAgents();
  select(a.id);
};
$("compose").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type: "message", text }));
  $("text").value = "";
};
$("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("compose").requestSubmit(); } };
$("stop").onclick = () => ws?.send(JSON.stringify({ type: "stop" }));
$("screen").onload = () => { if (!rfb || $("live").hidden) { $("screen").hidden = false; $("noscreen").hidden = true; } };
$("screen").onerror = () => { $("screen").hidden = true; $("noscreen").hidden = !$("live").hidden; };
$("takeover").onclick = () => ws?.send(JSON.stringify({ type: "take_over" }));
$("wake").onclick = () => ws?.send(JSON.stringify({ type: "wake" }));
$("handback").onclick = () => ws?.send(JSON.stringify({ type: "hand_back" }));
loadAgents();
</script>
</body>
</html>
