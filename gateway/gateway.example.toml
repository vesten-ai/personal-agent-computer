# Personal Agent Computer gateway configuration. Secrets are never written here:
# each one is the name of an environment variable the gateway reads at start.

data_dir = "/var/lib/pac"
listen_host = "127.0.0.1"   # published on the host through an Incus proxy device
listen_port = 8000
admin_token_env = "PAC_ADMIN_TOKEN"
# The egress proxy's CA; new agent VMs are told to trust it at first boot.
egress_ca_file = "/var/lib/pac-egress/mitm/mitmproxy-ca-cert.pem"
# The proxy's policy, rewritten by the gateway whenever agents change, and the allow/deny lists it starts from.
egress_policy_file = "/etc/pac/egress-policy.json"
egress_base_policy = "/etc/pac/egress-base.json"
default_model = "gpt"
max_steps = 60

[incus]
# The incus CLI, pointed at the host through a remote whose certificate is restricted to `project`.
command = ["incus"]
remote = "host"
project = "pac"
image = "pac-desktop/dev"
cpu = 2
memory = "4GiB"
disk = "20GiB"

# One table per model the agents can use. api = "openai" (Responses API) or "anthropic" (Messages API).
[models.gpt]
api = "openai"
model = "gpt-6.1-sol"
key_env = "PAC_MODEL_GPT_KEY"
# base_url = "https://api.openai.com/v1"
# "native" uses OpenAI's built-in computer tool; "function" offers the same actions as a function
# tool, for relays that don't support the built-in one.
tool_mode = "native"

[models.claude]
api = "anthropic"
model = "claude-opus-5-5"
key_env = "PAC_MODEL_CLAUDE_KEY"

# Credentials the agents may use but never hold. The real value lives only in the egress proxy's
# environment (/etc/pac/secrets.env, variable `value_env`). Each agent's VM gets its own placeholder in
# `vm_env`, and the proxy swaps it for the real value only on HTTPS requests to `hosts` that come from
# that agent's VM. The policy file is rewritten whenever agents are added or removed.

# [secrets.github]
# value_env = "PAC_SECRET_GITHUB"
# vm_env = "GH_TOKEN"
# hosts = ["api.github.com", "github.com"]
# prefix = "ghp_"          # shape the placeholder like the real thing, for clients that check

# Connectors: MCP servers the gateway runs outside the VMs. The model sees their tools as
# `<connector>__<tool>`. Credentials for them come from the gateway's environment, never the VM.
[connectors.notes]
command = ["/opt/pac/gateway-venv/bin/python", "-m", "pac_gateway.connectors.notes"]
env = { NOTES_FILE = "/var/lib/pac/notes.json" }
# secret_env = { SOME_TOKEN = "PAC_CONNECTOR_SOME_TOKEN" }
